name: PR Fast Checks

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: pr-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-fast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint & Type
        run: |
          black --check app tests
          isort --check-only app tests
          flake8 --max-line-length=100 --extend-ignore=E203 app tests
          mypy app
      - name: Tests (quick)
        run: pytest -q

  frontend-fast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Lint & Type
        run: |
          npm run lint
          npm run type-check
      - name: Tests (quick)
        run: npm test -- --watchAll=false --maxWorkers=50%

  summary:
    runs-on: ubuntu-latest
    needs: [backend-fast, frontend-fast]
    steps:
      - name: Result
        run: echo "Fast PR checks completed"
