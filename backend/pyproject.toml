[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
no_implicit_optional = true
pretty = true
python_version = "3.13"
show_error_codes = true
strict = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.flake8]
extend-ignore = ["E203"]
max-line-length = 100
